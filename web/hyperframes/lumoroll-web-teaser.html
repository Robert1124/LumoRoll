<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumoRoll HyperFrames Teaser</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="lumoroll-web-teaser"
      data-composition-id="lumoroll-web-teaser"
      data-start="0"
      data-duration="8"
      data-track-index="0"
      data-width="1080"
      data-height="1080"
    >
      <section class="scene-content">
        <div class="brand">
          <img src="../public/lumoroll-assets/lumoroll-brand-icon.png" alt="" />
          <span>LumoRoll</span>
        </div>

        <div class="stage">
          <div class="slide-card">
            <div class="slide-head">
              <span>001</span>
              <strong>WARM HAZE</strong>
              <i></i>
            </div>
            <p>COLOR ROLL</p>
            <div class="slide-window"><div></div></div>
            <div class="slide-foot">
              <span>LUT</span>
              <span>33x33x33</span>
            </div>
          </div>

          <div class="lightbox">
            <img class="back" src="../public/lumoroll-assets/lightbox-back-frame.png" alt="" />
            <div class="film">
              <div class="sprockets"></div>
              <div class="frames">
                <i></i><i></i><i></i><i></i><i></i><i></i>
              </div>
              <div class="sprockets"></div>
            </div>
            <img class="front" src="../public/lumoroll-assets/lightbox-front-block.png" alt="" />
          </div>
        </div>

        <div class="copy">
          <p>LOCAL COLOR ROLLS / 33x33x33 .CUBE</p>
          <h1>Create a personal Film Roll from one photo.</h1>
        </div>
      </section>

      <style>
        html,
        body {
          margin: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #f4efe6;
        }

        [data-composition-id="lumoroll-web-teaser"] {
          width: 1080px;
          height: 1080px;
          color: #1f1a14;
          background:
            linear-gradient(115deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 42%),
            repeating-linear-gradient(0deg, rgba(31, 26, 20, 0.018) 0 1px, transparent 1px 5px),
            #f4efe6;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
          overflow: hidden;
        }

        .scene-content {
          width: 100%;
          height: 100%;
          padding: 76px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          gap: 32px;
          box-sizing: border-box;
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 18px;
          font-size: 34px;
          font-weight: 760;
        }

        .brand img {
          width: 72px;
          height: 72px;
          border-radius: 18px;
        }

        .stage {
          position: relative;
          flex: 1;
        }

        .slide-card {
          position: absolute;
          left: 120px;
          top: 78px;
          width: 360px;
          height: 360px;
          padding: 34px;
          border-radius: 20px;
          background: linear-gradient(135deg, #fbf7ef, #efe3cb 48%, #fbf7ef);
          border: 1px solid rgba(31, 26, 20, 0.14);
          box-shadow: 0 28px 38px rgba(31, 26, 20, 0.22);
          box-sizing: border-box;
        }

        .slide-head,
        .slide-foot {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          color: #a33a2e;
          font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          font-size: 13px;
          font-weight: 780;
          letter-spacing: 0.12em;
        }

        .slide-head strong {
          min-width: 0;
          font-family: Georgia, "Times New Roman", serif;
          font-size: 18px;
          letter-spacing: 0.08em;
          white-space: nowrap;
        }

        .slide-head i {
          width: 11px;
          height: 11px;
          border-radius: 50%;
          background: #a33a2e;
        }

        .slide-card p,
        .copy p {
          font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
          font-weight: 780;
          letter-spacing: 0.14em;
          text-transform: uppercase;
        }

        .slide-card p {
          margin: 8px 0 32px;
          color: #a33a2e;
          text-align: center;
          font-size: 13px;
        }

        .slide-window {
          width: 210px;
          height: 126px;
          margin: 0 auto 30px;
          padding: 6px;
          border-radius: 12px;
          background: rgba(0, 0, 0, 0.84);
        }

        .slide-window div {
          height: 100%;
          border-radius: 8px;
          border: 2px solid rgba(0, 0, 0, 0.46);
          background: linear-gradient(140deg, #e89b7a, #e8c26a 46%, #7a85a0);
        }

        .lightbox {
          position: absolute;
          right: 10px;
          top: 120px;
          width: 440px;
          height: 350px;
        }

        .lightbox .back,
        .lightbox .front {
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
        }

        .lightbox .back {
          z-index: 1;
          width: 250px;
          height: 250px;
        }

        .lightbox .front {
          z-index: 3;
          width: 188px;
          height: 188px;
        }

        .film {
          position: absolute;
          left: -38px;
          top: 114px;
          z-index: 2;
          width: 520px;
          height: 122px;
          display: grid;
          align-content: center;
          gap: 6px;
          background: #0f0c09;
          border-radius: 8px;
          overflow: hidden;
        }

        .sprockets {
          height: 8px;
          background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.36) 0 4px, transparent 4px 11px);
        }

        .frames {
          height: 84px;
          display: flex;
          align-items: center;
          gap: 12px;
          padding-left: 90px;
        }

        .frames i {
          flex: 0 0 118px;
          height: 84px;
          border-radius: 5px;
          border: 1px solid rgba(255, 255, 255, 0.16);
          background: linear-gradient(140deg, #e89b7a, #f4efe6 48%, #2a2520);
          opacity: 0.62;
        }

        .frames i:nth-child(3) {
          opacity: 1;
        }

        .copy {
          max-width: 720px;
        }

        .copy p {
          margin: 0 0 20px;
          font-size: 18px;
          color: #918879;
        }

        .copy h1 {
          margin: 0;
          font-family: Georgia, "Times New Roman", serif;
          font-weight: 500;
          font-size: 92px;
          line-height: 0.92;
          letter-spacing: 0;
        }
      </style>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({paused: true, defaults: {ease: "power3.out"}});
        tl.from(".brand", {y: -24, opacity: 0, duration: 0.55}, 0)
          .from(".slide-card", {y: 78, rotation: -8, opacity: 0, duration: 0.75}, 0.18)
          .from(".lightbox", {x: 90, opacity: 0, duration: 0.75}, 0.32)
          .from(".copy p", {y: 30, opacity: 0, duration: 0.55}, 0.62)
          .from(".copy h1", {y: 42, opacity: 0, duration: 0.75}, 0.72)
          .to(".film", {x: -160, duration: 3.2, ease: "power1.inOut"}, 1.2)
          .to(".film", {x: -50, duration: 2.4, ease: "power1.inOut"}, 4.6);
        window.__timelines["lumoroll-web-teaser"] = tl;
      </script>
    </div>
  </body>
</html>
