name: LumoRoll
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  LumoRoll:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LumoRoll
        excludes:
          - Resources/Info.plist
          - Resources/Models/**
    resources:
      - path: LumoRoll/Resources
        excludes:
          - Models/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LumoRoll
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: LumoRoll/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
  LumoRollTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LumoRollTests
    dependencies:
      - target: LumoRoll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LumoRoll.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  LumoRoll:
    build:
      targets:
        LumoRoll: all
        LumoRollTests: [test]
    test:
      targets:
        - LumoRollTests
