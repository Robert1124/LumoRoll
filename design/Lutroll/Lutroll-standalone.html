<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1F1A14; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: "Geist", -apple-system, system-ui, sans-serif;
    color: #FBF7EF;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 30% 20%, #2A2520 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, #2C261E 0%, transparent 55%),
      #1A1612;
    background-attachment: fixed;
  }

  /* phone shelf — center the iOS frame & scale to viewport */
  .phone-stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .phone-wrap {
    position: relative;
    transform-origin: center;
  }

  /* environment label */
  .env-tag {
    position: fixed; left: 24px; top: 24px;
    display: flex; align-items: center; gap: 10px;
    color: rgba(255,255,255,0.55);
    font-family: "Geist Mono", monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    z-index: 2;
  }
  .env-tag .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #E89B7A;
    box-shadow: 0 0 12px #E89B7A;
    animation: env-pulse 2.4s ease-in-out infinite;
  }
  @keyframes env-pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

  .env-hint {
    position: fixed; right: 24px; top: 24px;
    color: rgba(255,255,255,0.45);
    font-family: "Geist", sans-serif;
    font-size: 11.5px; letter-spacing: -0.005em;
    z-index: 2; text-align: right; line-height: 1.4;
    max-width: 220px;
  }
  .env-hint em { font-family: "Instrument Serif", serif; font-style: italic; font-size: 14px; color: rgba(255,255,255,0.72); }
</style>

<script type="text/babel">
  // mount the app inside an iOS frame
  function Mount() {
    const [dark, setDark] = React.useState(false);
    React.useEffect(() => {
      const onRoute = (e) => {
        setDark(!!(e.detail && e.detail.dark));
      };
      window.addEventListener("lr-route", onRoute);
      return () => window.removeEventListener("lr-route", onRoute);
    }, []);
    return (
      <IOSDevice width={402} height={874} dark={dark}>
        <div style={{ height: "100%", overflow: "hidden", position: "relative" }}>
          <LutrollApp/>
        </div>
      </IOSDevice>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Mount/>);

  // responsive scale — fit the phone in the viewport with comfortable padding
  function fitPhone() {
    const stage = document.getElementById("phone-stage");
    const wrap  = document.getElementById("phone-wrap");
    if (!stage || !wrap) return;
    const pad = 24;
    const vw = stage.clientWidth - pad * 2;
    const vh = stage.clientHeight - pad * 2;
    const baseW = 402, baseH = 874;
    const scale = Math.min(vw / baseW, vh / baseH, 1.0);
    wrap.style.transform = `scale(${scale})`;
  }
  window.addEventListener("resize", fitPhone);
  // run after first paint
  setTimeout(fitPhone, 50);
  setTimeout(fitPhone, 400);
</script>
